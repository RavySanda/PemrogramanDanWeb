<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <a href="../index.html">SIMPUS-Mini</a>
            </div>

            <button class="nav-toggle" type="button">☰</button>

            <div class="nav-menu">
                <a href="../index.html">Beranda</a>
                <a href="../buku/list.html">Buku</a>
                <a href="list.html">Anggota</a>
            </div>
        </nav>
    </header>

    <main class="container">

        <div class="page-header">
            <h1>Daftar Anggota</h1>
            <a href="tambah.html" class="btn btn-primary">
                + Tambah Anggota
            </a>
        </div>

        <div class="search-box">
            <label for="search-input">Cari Nama Anggota</label>
            <input
                type="text"
                id="search-input"
                placeholder="Ketik nama anggota..."
            >
        </div>

        <p id="table-counter" class="text-primary fw-bold mb-2"></p>

        <!-- Loading indicator -->
        <p id="loading-indicator" style="display:none;">
            Memuat data...
        </p>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>No. Anggota</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>No. HP</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <!-- Data anggota akan dimasukkan oleh anggota.js -->
                <tbody></tbody>

            </table>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini</p>
        <p>Jobsheet 6 - Fetch API & JSON</p>
    </footer>

    <script src="../assets/js/app.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/anggota.js"></script>

</body>
</html>
