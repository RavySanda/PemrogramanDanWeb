<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Buku</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <a href="../index.html">SIMPUS-Mini</a>
            </div>

            <button class="nav-toggle" type="button">
                ☰
            </button>

            <div class="nav-menu">
                <a href="../index.html">Beranda</a>
                <a href="list.html">Buku</a>
                <a href="../anggota/list.html">Anggota</a>
            </div>
        </nav>
    </header>

    <main class="container">

        <div class="page-header">
    <h1>Daftar Buku</h1>

    <div>
        <a href="tambah.html" class="btn btn-primary">
            + Tambah Buku
        </a>

            <button     type="button" id="btn-muat-ulang" class="btn btn-secondary">
                Muat Ulang
            </button>
        </div>
    </div>

        <!-- Pencarian -->
        <div class="search-box">
            <label for="search-input">Cari Judul Buku</label>

            <input
                type="text"
                id="search-input"
                placeholder="Ketik judul buku..."
            >
        </div>

        <!-- Counter -->
        <p id="table-counter" class="text-primary fw-bold mb-2"></p>

        <!-- Loading Indicator -->
        <p id="loading-indicator" style="display:none;">
            Memuat data...
        </p>

        <!-- Tabel Buku -->
        <div class="table-responsive">
            <table class="table">

                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Kategori</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <!--
                    Data buku akan diisi secara dinamis
                    oleh assets/js/buku.js
                -->
                <tbody></tbody>

            </table>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini</p>
        <p>Jobsheet 6 - Fetch API & JSON</p>
    </footer>

    <script src="../assets/js/app.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/buku.js"></script>

</body>
</html>
