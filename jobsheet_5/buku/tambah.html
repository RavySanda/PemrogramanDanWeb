<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>

    <!-- CSS sendiri -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>SIMPUS-Mini</h1>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>

        <!-- Tombol hamburger JS-Driven -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">☰</button>
    </header>

    <!-- Isi Halaman -->
    <main>
        <section>
            <h2>Tambah Buku</h2>

            <!-- Tambahkan id="form-tambah" agar divalidasi oleh app.js -->
            <form id="form-tambah">
                <p>
                    <label for="judul">Judul</label>
                    <input type="text" id="judul" name="judul" required>
                </p>

                <p>
                    <label for="pengarang">Pengarang</label>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>

                <p>
                    <label for="tahun">Tahun Terbit</label>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>

                <p>
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn">
                </p>

                <p>
                    <label for="stok">Stok</label>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>

                <p>
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>

                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 SIMPUS-Mini — Jobsheet 5</p>
    </footer>

    <!-- Memanggil JavaScript -->
    <script src="../assets/js/app.js"></script>

</body>
</html>
