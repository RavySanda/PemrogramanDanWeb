<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Tambah Anggota</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white">

        <h1>SIMPUS-Mini</h1>

        <nav>
            <ul>
                <li>
                    <a href="../index.html">Beranda</a>
                </li>

                <li>
                    <a href="../buku/list.html">Daftar Buku</a>
                </li>

                <li>
                    <a href="list.html">Daftar Anggota</a>
                </li>

                <li>
                    <a href="tambah.html">Tambah Anggota</a>
                </li>
            </ul>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <section>

            <h2>
                Tambah Anggota
            </h2>

            <form>

                <p>
                    <label for="nama">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        required>
                </p>

                <p>
                    <label for="no_anggota">
                        No. Anggota
                    </label>

                    <input
                        type="text"
                        id="no_anggota"
                        name="no_anggota"
                        required>
                </p>

                <p>
                    <label for="alamat">
                        Alamat
                    </label>

                    <input
                        type="text"
                        id="alamat"
                        name="alamat">
                </p>

                <p>
                    <label for="no_hp">
                        No. HP
                    </label>

                    <input
                        type="text"
                        id="no_hp"
                        name="no_hp">
                </p>

                <p>
                    <button type="submit">
                        Simpan
                    </button>
                </p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>

</body>

</html>
